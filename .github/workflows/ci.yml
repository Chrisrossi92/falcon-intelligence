name: CI

on:
  push:
  pull_request:

jobs:
  backend-validation:
    name: Backend and repository validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Repository safety and privacy checks
        run: python scripts/check_repository_safety.py

      - name: Smoke tests (all discovered scripts)
        run: python scripts/run_smoke_suite.py

      - name: Backend tests
        run: PYTHONPATH=src python -m pytest

  frontend-validation:
    name: Frontend validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Frontend tests
        run: npm test -- --configLoader runner

      - name: Frontend production build
        run: npm run build -- --configLoader runner
